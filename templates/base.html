<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kotchy • ICPC Student Tracker{% endblock %}</title>

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Minimal Custom Overrides -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col antialiased selection:bg-sky-200 selection:text-sky-900">

    <!-- ── Compact Top Navigation Bar (h-14) with calm light blue header ─────── -->
    <header class="h-14 bg-sky-100/85 border-b border-sky-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
            <!-- Left: Brand & Navigation -->
            <div class="flex items-center gap-6">
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="w-7 h-7 rounded-lg bg-sky-600 text-white flex items-center justify-center font-bold text-xs shadow-xs shadow-sky-600/30 group-hover:bg-sky-500 transition-colors">
                        K
                    </div>
                    <span class="font-bold text-base tracking-tight text-slate-900 group-hover:text-sky-700 transition-colors">Kotchy</span>
                    <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-white text-sky-700 border border-sky-200 uppercase tracking-wide font-medium shadow-xs">Tracker</span>
                </a>

                <nav class="flex items-center gap-1.5">
                    <a href="/" 
                       class="px-3 py-1.5 text-xs font-medium rounded-md transition-all {% if active_page == 'dashboard' %}bg-white text-sky-700 font-semibold shadow-xs border border-sky-200{% else %}text-slate-600 hover:text-slate-900 hover:bg-white/60{% endif %}">
                        Dashboard
                    </a>
                    <a href="/students-page" 
                       class="px-3 py-1.5 text-xs font-medium rounded-md transition-all {% if active_page == 'students' %}bg-white text-sky-700 font-semibold shadow-xs border border-sky-200{% else %}text-slate-600 hover:text-slate-900 hover:bg-white/60{% endif %}">
                        Students
                    </a>
                    <a href="/tasks-page" 
                       class="px-3 py-1.5 text-xs font-medium rounded-md transition-all {% if active_page == 'tasks' %}bg-white text-sky-700 font-semibold shadow-xs border border-sky-200{% else %}text-slate-600 hover:text-slate-900 hover:bg-white/60{% endif %}">
                        Tasks
                    </a>
                </nav>
            </div>

            <!-- Right: Cohort Context (No /docs link) -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-2 px-2.5 py-1 rounded-full bg-white border border-sky-200 text-xs font-mono text-slate-700 shadow-xs">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="font-medium text-slate-700">ICPC Cohort 2026</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ── Main Workspace Container ────────────────────────────── -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Clean Minimal White Footer ──────────────────────────── -->
    <footer class="border-t border-slate-200 bg-white py-4 text-xs text-slate-500 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="font-medium text-slate-700">Kotchy Tracker</span>
                <span class="text-slate-300">•</span>
                <span>Local-first ICPC Coaching</span>
            </div>
            <div class="flex items-center gap-2 font-mono text-[11px] text-slate-500">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span>UTC Sync Active</span>
            </div>
        </div>
    </footer>

    <!-- ── Toast Notifications ─────────────────────────────────── -->
    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
