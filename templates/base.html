<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kotchy • ICPC Student Tracker{% endblock %}</title>

    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Minimal Custom Overrides -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block extra_head %}{% endblock %}
</head>
<body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col antialiased">

    <!-- ── Compact Top Navigation Bar (h-14) ───────────────────── -->
    <header class="h-14 bg-white border-b border-zinc-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
            <!-- Left: Brand & Navigation -->
            <div class="flex items-center gap-6">
                <a href="/" class="flex items-center gap-2 group">
                    <span class="font-bold text-base tracking-tight text-zinc-950">Kotchy</span>
                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-100 text-zinc-600 border border-zinc-200 uppercase tracking-wide">Tracker</span>
                </a>

                <nav class="flex items-center gap-1">
                    <a href="/" 
                       class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors {% if active_page == 'dashboard' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50{% endif %}">
                        Dashboard
                    </a>
                    <a href="/students-page" 
                       class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors {% if active_page == 'students' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50{% endif %}">
                        Students
                    </a>
                    <a href="/tasks-page" 
                       class="px-2.5 py-1 text-xs font-medium rounded-md transition-colors {% if active_page == 'tasks' %}bg-zinc-100 text-zinc-900 font-semibold{% else %}text-zinc-600 hover:text-zinc-900 hover:bg-zinc-50{% endif %}">
                        Tasks
                    </a>
                </nav>
            </div>

            <!-- Right: Cohort Context (No /docs link) -->
            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 text-xs font-mono text-zinc-500">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span>ICPC Cohort 2026</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ── Main Workspace Container ────────────────────────────── -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Minimal Footer ──────────────────────────────────────── -->
    <footer class="border-t border-zinc-200 bg-white py-4 text-xs text-zinc-500 mt-auto">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>Kotchy Tracker • Local-first ICPC Coaching</span>
            <div class="flex items-center gap-2 font-mono text-[11px] text-zinc-400">
                <span class="inline-block w-1.5 h-1.5 rounded-full bg-zinc-300"></span>
                <span>UTC Sync Active</span>
            </div>
        </div>
    </footer>

    <!-- ── Toast Notifications ─────────────────────────────────── -->
    <div id="toast-container" class="fixed top-16 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"></div>

    <script src="/static/js/main.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
