<!-- ── Create Task Modal (Shared Component) ─────────────────── -->
<div id="create-task-modal" class="kotchy-modal hidden fixed inset-0 z-50 modal-overlay items-center justify-center p-4">
    <div class="bg-white border border-zinc-200 max-w-lg w-full rounded-lg p-5 shadow-lg">
        <div class="flex items-center justify-between pb-3 border-b border-zinc-100">
            <h3 class="text-sm font-bold text-zinc-900">Create Task Set</h3>
            <button type="button" onclick="Kotchy.closeModal('create-task-modal')" class="text-zinc-400 hover:text-zinc-700 text-xs">✕</button>
        </div>

        <form onsubmit="Kotchy.Task.submitCreate(event)" class="mt-4 space-y-3">
            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Title *</label>
                <input type="text" name="title" required placeholder="e.g. Dynamic Programming 1"
                       class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 focus:outline-none focus:border-zinc-900">
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Description</label>
                <input type="text" name="description" placeholder="Optional notes or instructions"
                       class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 focus:outline-none focus:border-zinc-900">
            </div>

            <div>
                <label class="block text-xs font-medium text-zinc-700 mb-1">Task Type</label>
                <select name="task_type" onchange="Kotchy.Task.toggleTypeFields(this.value)"
                        class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 focus:outline-none focus:border-zinc-900 font-mono">
                    <option value="CF_SHEET" selected>CF_SHEET (Problem List)</option>
                    <option value="CF_CONTEST">CF_CONTEST (Contest)</option>
                </select>
            </div>

            <!-- Sheet Fields -->
            <div id="sheet-fields" class="space-y-3 pt-1">
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Problem Codes (comma/space separated) *</label>
                    <textarea name="problems" rows="2" placeholder="4A, 71A, 158A, 118D"
                              class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 font-mono focus:outline-none focus:border-zinc-900"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Min Solved Required</label>
                    <input type="number" name="min_solved_count" min="1" placeholder="Defaults to all problems"
                           class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 font-mono focus:outline-none focus:border-zinc-900">
                </div>
            </div>

            <!-- Contest Fields -->
            <div id="contest-fields" class="hidden space-y-3 pt-1">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-zinc-700 mb-1">Contest ID *</label>
                        <input type="number" name="contest_id" placeholder="1985"
                               class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 font-mono focus:outline-none focus:border-zinc-900">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-zinc-700 mb-1">Min Solved</label>
                        <input type="number" name="contest_min_solved" min="0" value="0" placeholder="0 = All problems"
                               class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900 font-mono focus:outline-none focus:border-zinc-900">
                        <p class="text-[10px] text-zinc-400 mt-0.5">0 = Require solving whole contest.</p>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-700 mb-1">Access Type</label>
                    <select name="access_type" class="w-full px-2.5 py-1.5 rounded border border-zinc-300 text-xs text-zinc-900">
                        <option value="public" selected>Public</option>
                        <option value="private_managed">Private Managed</option>
                    </select>
                </div>
            </div>

            <div class="pt-3 flex items-center justify-end gap-2 border-t border-zinc-100">
                <button type="button" onclick="Kotchy.closeModal('create-task-modal')"
                        class="px-3 py-1.5 rounded border border-zinc-300 text-xs font-medium text-zinc-700 hover:bg-zinc-50">
                    Cancel
                </button>
                <button type="submit"
                        class="px-3 py-1.5 rounded bg-zinc-900 text-white text-xs font-medium hover:bg-zinc-800">
                    Create Task
                </button>
            </div>
        </form>
    </div>
</div>
